name: Ubuntu + Tailscale + Ollama AI API

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model to serve (CPU-only runner: keep it ~7B or smaller)"
        default: "llama3.2:3b"
        required: true
      extra_models:
        description: "Optional extra models, comma separated (e.g. nomic-embed-text,qwen2.5-coder:3b)"
        default: ""
        required: false

jobs:
  ai-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # GitHub hard limit is 360 min per job

    env:
      OLLAMA_PORT: "11434"
      MODEL: ${{ inputs.model }}
      EXTRA_MODELS: ${{ inputs.extra_models }}

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailnet
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="gh-ai-${GITHUB_RUN_ID}" \
            --accept-dns=false \
            --ssh

          TS_IP=""
          for i in $(seq 1 12); do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -n1 || true)
            [ -n "$TS_IP" ] && break
            sleep 5
          done
          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"; exit 1
          fi
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Stop the default service; we run our own instance bound only to the Tailscale IP
          sudo systemctl stop ollama || true
          sudo systemctl disable ollama || true

      - name: Start Ollama API (Tailscale-only)
        run: |
          export OLLAMA_HOST="${TS_IP}:${OLLAMA_PORT}"
          export OLLAMA_KEEP_ALIVE=-1          # keep model loaded in RAM
          export OLLAMA_ORIGINS="*"            # allow browser apps on your tailnet
          nohup ollama serve > "$HOME/ollama.log" 2>&1 &

          for i in $(seq 1 30); do
            curl -fs "http://${TS_IP}:${OLLAMA_PORT}/api/tags" >/dev/null && break
            sleep 2
          done
          curl -fs "http://${TS_IP}:${OLLAMA_PORT}/api/tags" >/dev/null || { cat "$HOME/ollama.log"; exit 1; }
          echo "Ollama is up."

      - name: Pull models
        run: |
          export OLLAMA_HOST="${TS_IP}:${OLLAMA_PORT}"
          ollama pull "$MODEL"
          if [ -n "$EXTRA_MODELS" ]; then
            IFS=',' read -ra M <<< "$EXTRA_MODELS"
            for m in "${M[@]}"; do ollama pull "$(echo "$m" | xargs)"; done
          fi
          ollama list

      - name: Warm up and verify API
        run: |
          curl -fs "http://${TS_IP}:${OLLAMA_PORT}/api/generate" \
            -d "{\"model\":\"${MODEL}\",\"prompt\":\"Say hi in one word.\",\"stream\":false}" \
            | head -c 400
          echo

      - name: Print connection info
        run: |
          echo ""
          echo "=========== AI API READY ==========="
          echo "Native API:      http://${TS_IP}:${OLLAMA_PORT}"
          echo "OpenAI-compat:   http://${TS_IP}:${OLLAMA_PORT}/v1"
          echo "Model:           ${MODEL}"
          echo "SSH (tailscale): ssh runner@${TS_IP}"
          echo ""
          echo "Example:"
          echo "  curl http://${TS_IP}:${OLLAMA_PORT}/v1/chat/completions \\"
          echo "    -H 'Content-Type: application/json' \\"
          echo "    -d '{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"Hello\"}]}'"
          echo "===================================="

      - name: Keep alive and watchdog
        run: |
          export OLLAMA_HOST="${TS_IP}:${OLLAMA_PORT}"
          while true; do
            if ! curl -fs "http://${TS_IP}:${OLLAMA_PORT}/api/tags" >/dev/null; then
              echo "[$(date)] Ollama down, restarting..."
              OLLAMA_KEEP_ALIVE=-1 OLLAMA_ORIGINS="*" nohup ollama serve >> "$HOME/ollama.log" 2>&1 &
              sleep 10
            fi
            echo "[$(date)] API alive at http://${TS_IP}:${OLLAMA_PORT}"
            sleep 300
          done
