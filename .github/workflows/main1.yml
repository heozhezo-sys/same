name: Ubuntu + Tailscale + Ollama + Qwen3-Coder

on:
  workflow_dispatch:

jobs:
  ollama-tailscale:
    runs-on: ubuntu-latest          # 4 CPU, 16 GB RAM, 14 GB SSD
    timeout-minutes: 350

    steps:
      # ------------------------------------------------------------
      # 1. Install Tailscale and connect to your tailnet
      # ------------------------------------------------------------
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # Optional: give the ephemeral node a descriptive name
          # tags: tag:ci
        # The action automatically creates an ephemeral node that is
        # removed when the job finishes.

      # ------------------------------------------------------------
      # 2. Install Ollama (official install script)
      # ------------------------------------------------------------
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # ------------------------------------------------------------
      # 3. Cache the Ollama model directory for faster subsequent runs
      # ------------------------------------------------------------
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen3-coder-${{ runner.os }}-${{ hashFiles('**/ollama-model-version.txt') }}
          restore-keys: |
            ollama-models-qwen3-coder-

      # ------------------------------------------------------------
      # 4. Pull the Qwen3-Coder model (30B-A3B, Q4_K_M ~18 GB)
      #    If you need a smaller footprint, use a higher quantization
      #    level (e.g., Q3_K_S ~13 GB) – see the notes below.
      # ------------------------------------------------------------
      - name: Pull Qwen3-Coder model
        run: |
          ollama pull qwen3-coder:30b-a3b-q4_K_M
          # For a lighter model (faster on CPU):
          # ollama pull qwen3-coder:30b-a3b-q3_K_S

      # ------------------------------------------------------------
      # 5. Start Ollama server with performance‑tuned environment
      # ------------------------------------------------------------
      - name: Start Ollama server
        env:
          OLLAMA_NUM_PARALLEL: "4"          # match CPU cores (4)
          OLLAMA_MAX_LOADED_MODELS: "1"     # only one model in memory
          OLLAMA_KEEP_ALIVE: "-1"           # never unload the model
          OLLAMA_CONTEXT_SIZE: "32768"      # 32k context (adjust as needed)
          OLLAMA_NUM_THREAD: "4"            # use all 4 vCPUs
          OLLAMA_FLASH_ATTENTION: "1"       # enable flash attention
        run: |
          ollama serve &
          # wait for the server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama server is up."
              break
            fi
            echo "Waiting for Ollama..."
            sleep 2
          done

      # ------------------------------------------------------------
      # 6. Get the Tailscale IP of this runner
      # ------------------------------------------------------------
      - name: Get Tailscale IP
        id: tailscale-ip
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

      # ------------------------------------------------------------
      # 7. Verify the Ollama API is reachable over Tailscale
      # ------------------------------------------------------------
      - name: Verify Ollama over Tailscale
        run: |
          curl -s http://${{ env.TAILSCALE_IP }}:11434/api/tags | head -c 500
          echo ""
          echo "Ollama is reachable via Tailscale."

      # ------------------------------------------------------------
      # 8. Keep the runner alive and optionally run a test prompt
      # ------------------------------------------------------------
      - name: Keep runner alive and test model
        run: |
          echo "=== OLLAMA ACCESS ==="
          echo "Address: http://${{ env.TAILSCALE_IP }}:11434"
          echo "Model: qwen3-coder:30b-a3b-q4_K_M"
          echo "====================="
          
          # Quick test prompt (optional, comment out if not needed)
          curl -s http://localhost:11434/api/generate -d '{
            "model": "qwen3-coder:30b-a3b-q4_K_M",
            "prompt": "Write a hello world in Python.",
            "stream": false
          }' | jq -r '.response' | head -20
          
          echo ""
          echo "Runner will stay alive for 5 hours. Use Tailscale to connect."
          
          # Keep the job running so the runner stays alive
          while true; do
            echo "[$(date)] Runner active – Tailscale IP: $TAILSCALE_IP"
            sleep 300
          done
